<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Startup Jobs Board</title>
<meta name="description" content="Open roles at early-stage startups, updated live from a Google Sheet." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="profile" id="profile">
      <div class="avatar" id="avatar">?</div>
      <div class="profile-text">
        <h1 id="profile-name">Loading…</h1>
        <p class="tagline" id="profile-title"></p>
        <p class="bio" id="profile-bio"></p>
        <div class="contact-row" id="contact-row"></div>
      </div>
    </div>
  </div>
  <div class="hero-glow"></div>
</header>

<main class="wrap">

  <section class="toolbar">
    <div class="filters" id="status-filters">
      <button class="chip active" data-filter="Open">Open roles</button>
      <button class="chip" data-filter="All">All</button>
      <button class="chip" data-filter="Closed">Closed / filled</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search by title, company, or location…" />
    </div>
  </section>

  <p class="status-line" id="status-line">Loading open roles…</p>

  <section id="jobs-grid" class="jobs-grid"></section>

  <p class="empty-state" id="empty-state" hidden>No roles match that search right now — check back soon.</p>

</main>

<footer class="site-footer">
  <p>Powered by a Google Sheet — this page refreshes itself, nobody needs to touch the code to post a new role.</p>
  <p class="updated" id="last-updated"></p>
</footer>

<script src="js/vendor/papaparse.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
